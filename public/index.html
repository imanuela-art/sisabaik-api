<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SisaBaik API Chapter 7</title>

    
<style>
  :root {
    font-family: Arial, sans-serif;
    color: #203b35;
    background: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px 20px 32px;
  }

  main {
    max-width: 750px;
    margin: 0 auto;
  }

  section {
    border: 1px solid #d7e1dd;
    border-radius: 9px;
    padding: 20px;
    margin-bottom: 12px;
    background: #fff;
  }

  h2 {
    font-size: 18px;
    margin: 6px 0 18px;
  }

  p {
    font-size: 14px;
    line-height: 1.6;
  }

  .grid {
    display: grid;
    gap: 12px;
  }

  .grid > * {
    background: #edf8f3;
    padding: 12px;
    border-radius: 8px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 345px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 9px;
    border: 1px solid #aaa;
    border-radius: 3px;
    margin-bottom: 5px;
  }

  button {
    background: #17866e;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 11px;
    cursor: pointer;
  }

  button:hover {
    background: #106b58;
  }

  pre {
    background: #102b25;
    color: #fff;
    border-radius: 5px;
    padding: 14px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
</style>

    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="konten-utama">
      <section aria-labelledby="judul-katalog">
        <h2 id="judul-katalog">Penawaran tersedia</h2>
        <p id="status" role="status" aria-live="polite">
          Memuat data...
        </p>
        <div id="katalog" class="grid"></div>
      </section>

      <section aria-labelledby="judul-pesanan">
        <h2 id="judul-pesanan">Uji pembuatan pesanan</h2>

        <form id="form-pesanan">
          <label for="nama">Email pembeli latihan</label>
          <input id="nama" name="emailPembeli" type="email" required />

          <label for="penawaran">ID penawaran</label>
          <input
            id="penawaran"
            name="penawaranId"
            inputmode="numeric"
            pattern="[1-9][0-9]{0,18}"
            required
          />

          <label for="kuantitas">Kuantitas</label>
          <input
            id="kuantitas"
            name="kuantitas"
            type="number"
            min="1"
            max="1000"
            step="1"
            required
          />

          <button type="submit">Kirim pesanan latihan</button>
        </form>

        <p id="status-pesanan" role="status" aria-live="polite"></p>
        <pre id="hasil-pesanan">Belum ada respons.</pre>
      </section>
    </main>
  </body>
</html>
