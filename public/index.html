<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SisaBaik API Chapter 7</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="konten-utama">
      <section aria-labelledby="judul-katalog">
        <h2 id="judul-katalog">Penawaran tersedia</h2>
        <p id="status" role="status" aria-live="polite">
          Memuat data...
        </p>
        <div id="katalog" class="grid"></div>
      </section>

      <section aria-labelledby="judul-pesanan">
        <h2 id="judul-pesanan">Uji pembuatan pesanan</h2>

        <form id="form-pesanan">
          <label for="nama">Email pembeli latihan</label>
          <input id="nama" name="emailPembeli" type="email" required />

          <label for="penawaran">ID penawaran</label>
          <input
            id="penawaran"
            name="penawaranId"
            inputmode="numeric"
            pattern="[1-9][0-9]{0,18}"
            required
          />

          <label for="kuantitas">Kuantitas</label>
          <input
            id="kuantitas"
            name="kuantitas"
            type="number"
            min="1"
            max="1000"
            step="1"
            required
          />

          <button type="submit">Kirim pesanan latihan</button>
        </form>

        <p id="status-pesanan" role="status" aria-live="polite"></p>
        <pre id="hasil-pesanan">Belum ada respons.</pre>
      </section>
    </main>
  </body>
</html>
